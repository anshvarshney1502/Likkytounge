<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · Likky Tounge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./icons/icon48.png" alt="" width="28" height="28">
      <div>
        <strong>Likky Tounge</strong>
        <div class="tagline muted">Your local AI-chat vault.</div>
      </div>
    </div>
    <nav class="topnav">
      <a class="btn" href="./library.html">📚 Library</a>
      <a class="btn" href="./settings.html">⚙️ Settings</a>
    </nav>
  </header>

  <main class="page" role="main">
    <h1 style="margin:0;">Library</h1>
    <p class="muted">Everything here is stored locally on this device. Nothing is uploaded.</p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search chats…" aria-label="Search chats">
      <select id="platform" aria-label="Filter by platform"><option value="">All platforms</option></select>
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
      <button id="export-all" class="btn">Backup all</button>
      <button id="delete-all" class="btn btn-danger">Delete all</button>
    </div>

    <div id="stats" class="stats muted"></div>
    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>No saved conversations yet.<br><span class="muted">Open a supported chat and click <b>Save Current Chat</b>.</span></div>
  </main>
  <script src="./library.js"></script>
</body>
</html>
