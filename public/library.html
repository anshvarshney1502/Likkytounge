<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · Likky Tounge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./icons/icon48.png" alt="" width="28" height="28">
      <div>
        <strong>Likky Tounge</strong>
        <div class="tagline muted small">Capsules of context — ready in any AI chat.</div>
      </div>
    </div>
    <nav class="topnav">
      <a class="btn" href="./library.html">📚 Library</a>
      <a class="btn" href="./cook.html">🧑‍🍳 Cook prompt</a>
      <a class="btn" href="./settings.html">⚙️ Settings</a>
    </nav>
  </header>

  <main class="lib-layout">
    <aside class="lib-side" aria-label="Folders">
      <div class="row spread">
        <strong>Folders</strong>
        <button id="new-folder" class="btn small" title="New folder">＋</button>
      </div>
      <ul id="folders" class="folder-list"></ul>
      <div class="section">
        <button id="new-capsule" class="btn btn-primary block">＋ New capsule</button>
      </div>
      <div class="hint muted small">
        Tip: right-click any text on a webpage and choose <b>Save selection as Capsule</b>.
      </div>
    </aside>

    <section class="lib-mid" aria-label="Capsule list">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search capsules…" aria-label="Search">
        <select id="sort" aria-label="Sort">
          <option value="updated">Recently updated</option>
          <option value="used">Most used</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
      <div id="capsule-list" class="capsule-list"></div>
      <div id="capsule-empty" class="empty" hidden>No capsules in this view yet.</div>
    </section>

    <section class="lib-edit" aria-label="Editor">
      <div id="editor" hidden>
        <div class="field">
          <label for="ed-title">Title</label>
          <input id="ed-title" type="text">
        </div>
        <div class="row" style="gap:10px;">
          <div class="field grow">
            <label for="ed-folder">Folder</label>
            <select id="ed-folder"></select>
          </div>
          <div class="field grow">
            <label for="ed-tags">Tags (comma-separated)</label>
            <input id="ed-tags" type="text" placeholder="engineering, planning">
          </div>
        </div>
        <div class="field">
          <label for="ed-body">Body</label>
          <textarea id="ed-body" rows="16" placeholder="The context that will be inserted into a chat when you use this capsule."></textarea>
        </div>
        <div class="row" style="gap:8px; flex-wrap:wrap;">
          <button id="ed-save" class="btn btn-primary">Save</button>
          <button id="ed-copy" class="btn">Copy body</button>
          <button id="ed-cook" class="btn">🧑‍🍳 Cook this…</button>
          <button id="ed-delete" class="btn btn-danger" style="margin-left:auto;">Delete</button>
        </div>
        <p id="ed-meta" class="muted small"></p>
      </div>
      <div id="editor-empty" class="empty">Select a capsule to edit, or create a new one.</div>
    </section>
  </main>
  <script src="./library.js"></script>
</body>
</html>
