<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Likky Tounge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="popup" role="main">
    <div class="popup-brand">
      <img src="./icons/icon48.png" alt="">
      Likky Tounge
    </div>

    <h1 class="popup-headline" id="headline">Your conversations,<br>remembered.</h1>

    <div class="popup-cta">
      <button id="open-library" class="btn-primary block">Check your previous context</button>
    </div>

    <div id="last-context" class="last-context-card" hidden>
      <span class="lc-label">Latest</span>
      <span class="lc-title" id="lc-title"></span>
      <span class="lc-meta" id="lc-meta"></span>
    </div>

    <p id="popup-empty" class="popup-empty" hidden>
      Click Pikachu on ChatGPT, Claude, Gemini, or DeepSeek to generate your first context — it will appear here.
    </p>

    <div class="popup-divider"></div>

    <div class="popup-foot">
      <a id="open-settings" href="#">Settings</a>
      <a id="open-about" href="#">About</a>
    </div>
  </main>
  <script src="./popup.js"></script>
</body>
</html>
