<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cook prompt · Likky Tounge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./icons/icon48.png" alt="" width="28" height="28">
      <div>
        <strong>Likky Tounge</strong>
        <div class="tagline muted small">Cook This Prompt — 100% local, no API keys.</div>
      </div>
    </div>
    <nav class="topnav">
      <a class="btn" href="./library.html">📚 Library</a>
      <a class="btn" href="./cook.html">🧑‍🍳 Cook prompt</a>
      <a class="btn" href="./settings.html">⚙️ Settings</a>
    </nav>
  </header>

  <main class="page">
    <h1 style="margin:0;">Cook this prompt</h1>
    <p class="muted">Paste a rough prompt, pick recipes, get a stronger one. Everything runs on this device.</p>

    <div class="cook-grid">
      <section>
        <div class="field">
          <label for="cook-in">Your prompt</label>
          <textarea id="cook-in" rows="10" placeholder="Write me a story about a robot who finds a puppy…"></textarea>
        </div>
        <div class="field">
          <label>Recipes</label>
          <div id="recipes" class="recipes"></div>
        </div>
        <div class="field" id="vars-wrap" hidden>
          <label>Variables</label>
          <div id="vars"></div>
        </div>
        <div class="row" style="gap:10px;">
          <button id="cook-run" class="btn btn-primary">🧑‍🍳 Cook it</button>
          <button id="cook-clear" class="btn">Clear</button>
        </div>
      </section>

      <section>
        <div class="field">
          <label for="cook-out">Cooked prompt</label>
          <textarea id="cook-out" rows="18" readonly></textarea>
        </div>
        <div class="row" style="gap:10px;">
          <button id="cook-copy" class="btn">Copy</button>
          <button id="cook-save" class="btn">Save as capsule</button>
        </div>
      </section>
    </div>
  </main>
  <script src="./cook.js"></script>
</body>
</html>
