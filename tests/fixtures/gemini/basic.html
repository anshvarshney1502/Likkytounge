<!doctype html>
<html>
<head><title>Statistics questions - Gemini</title></head>
<body>
  <div class="chat-history">
    <user-query>
      <div class="query-text">What is the difference between variance and standard deviation?</div>
    </user-query>
    <model-response>
      <message-content class="model-response-text">
        <div class="markdown">
          <p>Variance is the average squared deviation; standard deviation is its square root.</p>
          <p>Formula: std = sqrt(variance).</p>
        </div>
      </message-content>
    </model-response>
    <user-query>
      <div class="query-text">Give an example.</div>
    </user-query>
    <model-response>
      <message-content class="model-response-text">
        <div class="markdown"><p>For data [2,4,4,4,5,5,7,9], variance is 4 and std is 2.</p></div>
      </message-content>
    </model-response>
  </div>
</body>
</html>
