<!doctype html>
<html>
<head><title>Some AI Chat</title></head>
<body>
  <main>
    <div class="chat-message message-user">
      <div class="bubble">Hello, can you help me with math?</div>
    </div>
    <div class="chat-message message-assistant">
      <div class="bubble">
        <p>Of course! What problem are you working on?</p>
      </div>
    </div>
    <div class="chat-message message-user">
      <div class="bubble">What is 12 times 8?</div>
    </div>
    <div class="chat-message message-assistant">
      <div class="bubble"><p>12 times 8 is 96.</p></div>
    </div>
  </main>
</body>
</html>
